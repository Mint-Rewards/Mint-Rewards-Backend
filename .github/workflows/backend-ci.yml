name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Every run points jest at the same MONGODB_URI_TEST database, and the fixtures
# are not namespaced per run — activeCampaigns.test.ts seeds a legacy brand doc
# with no registrationNumber, which the unique index allows exactly one of
# collection-wide. Two runs overlapping (a batch of dependabot PRs, or a push
# plus its PR) therefore fail with E11000 on whichever loses the race.
#
# A constant group serialises Backend CI across every branch and event.
# cancel-in-progress stays false: each run is validating a different commit,
# so a queued run must still get its turn rather than be dropped.
concurrency:
  group: backend-ci-shared-test-db
  cancel-in-progress: false

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest

    # lib/env.ts validates every key below at module load and throws on the
    # first import, so `next build` and any suite that imports app.ts need the
    # full set present — not just the ones a given test actually reads.
    #
    # Everything here is a syntactically-valid placeholder: no suite talks to
    # Google, Apple, Resend or Blob for real, and APP_ENV=development plus a
    # fake RESEND_API_KEY means nothing can reach an actual recipient. The
    # "Run tests" step below overrides the three keys that must be real.
    env:
      APP_ENV: development
      # Overwritten by jest.setup.js with MONGODB_URI_TEST. Present only so the
      # build step, which never connects, passes lib/env.ts format validation.
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-build-check
      # Overridden with the real secrets for "Run tests", which signs and
      # verifies tokens. The build only needs them to satisfy the length check.
      JWT_SECRET: ci-placeholder-jwt-secret
      BRANDHUB_JWT_SECRET: ci-placeholder-brandhub-secret
      ADMIN_JWT_SECRET: ci-placeholder-admin-jwt-secret
      ADMIN_EMAIL: admin@example.com
      # bcrypt hash of a throwaway string; never used to authenticate in CI.
      ADMIN_PASSWORD_HASH: "$2b$10$CwTycUXWue0Thq9StjUM0uJ8.PjMDCLPu2H8dQmDCkPGYr8SoQO0O"
      OTP_PEPPER: ci-placeholder-otp-pepper
      GOOGLE_IOS_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      APPLE_BUNDLE_ID: com.example.ci
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.com
      DEV_MAIL_REDIRECT_TO: sink@example.com
      BLOB_PUBLIC_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder
      ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SCA — npm audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          # jest.setup.js requires MONGODB_URI_TEST by name and remaps it
          # onto MONGODB_URI itself — passing it as MONGODB_URI trips the
          # refuse-to-run guard.
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BRANDHUB_JWT_SECRET: ${{ secrets.BRANDHUB_JWT_SECRET }}
          NODE_ENV: test

      - name: Build check
        run: npm run build --if-present

  smoke-test:
    name: Smoke Test (Production)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Ping health endpoint
        run: |
          curl --fail https://mint-rewards-backend.vercel.app/api/health || exit 1
