name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: SCA — npm audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          # jest.setup.js requires MONGODB_URI_TEST by name and remaps it
          # onto MONGODB_URI itself — passing it as MONGODB_URI trips the
          # refuse-to-run guard.
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BRANDHUB_JWT_SECRET: ${{ secrets.BRANDHUB_JWT_SECRET }}
          NODE_ENV: test

      - name: Build check
        run: npm run build --if-present

  smoke-test:
    name: Smoke Test (Production)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Ping health endpoint
        run: |
          curl --fail https://mint-rewards-backend.vercel.app/api/health || exit 1