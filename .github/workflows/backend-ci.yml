name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: SCA — npm audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          # jest.setup.js requires MONGODB_URI_TEST by name and remaps it
          # onto MONGODB_URI itself — passing it as MONGODB_URI trips the
          # refuse-to-run guard.
          MONGODB_URI_TEST: ${{ secrets.MONGODB_URI_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BRANDHUB_JWT_SECRET: ${{ secrets.BRANDHUB_JWT_SECRET }}
          NODE_ENV: test
          # Everything else lib/env.ts requires is filled by the inert
          # TEST_DEFAULTS in jest.setup.js.
          APP_ENV: development

      - name: Build check
        run: npm run build --if-present

  smoke-test:
    name: Smoke Test (Deployed)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Resolve target deployment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=https://mint-rewards-backend.vercel.app" >> "$GITHUB_OUTPUT"
            echo "expected_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://api-dev.mintrewards.app" >> "$GITHUB_OUTPUT"
            echo "expected_env=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Vercel deployment
        run: sleep 45

      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            "${{ steps.target.outputs.url }}/api/health" -o health.json
          cat health.json

      - name: Assert the deployment reports the expected environment
        run: |
          actual=$(jq -r '.environment' health.json)
          expected="${{ steps.target.outputs.expected_env }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${{ steps.target.outputs.url }} reports environment=$actual, expected $expected"
            exit 1
          fi
          echo "Confirmed: $actual"
          echo "Database:  $(jq -r '.database.name' health.json)"
          echo "Commit:    $(jq -r '.commit' health.json)"